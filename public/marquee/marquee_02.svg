<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="420" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1A14"/><stop offset="1" stop-color="#090D0A"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 60) scale(190)">
      <stop stop-color="#2ea36b" stop-opacity="0.4"/><stop offset="1" stop-color="#2ea36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar2" x1="0" y1="236" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c6b45"/><stop offset="1" stop-color="#3ee88f"/>
    </linearGradient>
  </defs>
  <rect width="420" height="270" rx="18" fill="url(#bg2)"/>
  <rect width="420" height="270" rx="18" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="418.5" height="268.5" rx="17.25" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- KPI chips -->
  <g>
    <rect x="26" y="84" width="86" height="46" rx="10" fill="#12241a" stroke="#2ea36b" stroke-opacity="0.3"/>
    <rect x="38" y="94" width="40" height="8" rx="4" fill="#2ea36b" opacity="0.5"/>
    <rect x="38" y="108" width="58" height="12" rx="4" fill="#7fe0ac"/>
    <rect x="122" y="84" width="86" height="46" rx="10" fill="#12241a" stroke="#2ea36b" stroke-opacity="0.3"/>
    <rect x="134" y="94" width="34" height="8" rx="4" fill="#2ea36b" opacity="0.5"/>
    <rect x="134" y="108" width="52" height="12" rx="4" fill="#7fe0ac"/>
  </g>

  <!-- bars -->
  <g>
    <rect x="26" y="176" width="24" height="60" rx="5" fill="url(#bar2)"/>
    <rect x="58" y="152" width="24" height="84" rx="5" fill="url(#bar2)"/>
    <rect x="90" y="196" width="24" height="40" rx="5" fill="url(#bar2)"/>
    <rect x="122" y="164" width="24" height="72" rx="5" fill="url(#bar2)"/>
    <rect x="154" y="184" width="24" height="52" rx="5" fill="url(#bar2)"/>
  </g>

  <!-- donut -->
  <g transform="translate(316 168)">
    <circle r="52" fill="#0e1a12"/>
    <circle r="42" fill="none" stroke="#1b3a29" stroke-width="18"/>
    <circle r="42" fill="none" stroke="#3ee88f" stroke-width="18" stroke-dasharray="150 264" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="42" fill="none" stroke="#a7f3d0" stroke-width="18" stroke-dasharray="70 264" stroke-linecap="round" transform="rotate(115)"/>
  </g>

  <text x="26" y="52" fill="#eafff3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Excel Dashboard</text>
  <text x="27" y="72" fill="#5f9078" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing="1">KPIs · PIVOTS · SLICERS</text>
</svg>
